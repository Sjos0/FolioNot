name: Android CI and Releases

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: folionote-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build and test FolioNote
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle from the committed Wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare debug signing key
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storetype JKS \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Determine Android version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Use tags in semantic version format: vMAJOR.MINOR.PATCH"
              exit 1
            fi
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            if (( MINOR > 999 || PATCH > 999 )); then
              echo "Minor and patch components must be between 0 and 999."
              exit 1
            fi
            VERSION_CODE=$((200000000 + MAJOR * 1000000 + MINOR * 1000 + PATCH))
            if (( VERSION_CODE > 2100000000 )); then
              echo "Version code exceeds Android maximum (2100000000)."
              exit 1
            fi
          else
            VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"
            VERSION_CODE=$((100000000 + GITHUB_RUN_NUMBER))
          fi
          echo "APP_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Run unit tests (API 24..36 matrix) and build debug APK
        run: |
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug \
            -PappVersionName="$APP_VERSION_NAME" \
            -PappVersionCode="$APP_VERSION_CODE"

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: folionote-unit-test-reports-${{ github.run_id }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload debug APK
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: FolioNote-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Restore release signing key
        if: github.ref_type == 'tag'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 repository secret" && exit 1)
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/my-upload-key.jks"
          chmod 600 "$GITHUB_WORKSPACE/my-upload-key.jks"

      - name: Build signed release APK
        if: github.ref_type == 'tag'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$STORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD repository secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD repository secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS repository secret" && exit 1)
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease \
            -PappVersionName="$APP_VERSION_NAME" \
            -PappVersionCode="$APP_VERSION_CODE"

      - name: Verify release APK and generate release-manifest.json
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$SOURCE_APK" || (echo "Release APK not found at $SOURCE_APK" && exit 1)

          APK_NAME="FolioNote-${GITHUB_REF_NAME}.apk"
          mkdir -p dist
          cp "$SOURCE_APK" "dist/$APK_NAME"

          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          BADGING="$("$AAPT2" dump badging "dist/$APK_NAME")"
          echo "$BADGING" | grep -q "package: name='com.sjos.folionote'" || (echo "Invalid package name in APK" && exit 1)
          echo "$BADGING" | grep -q "versionCode='${APP_VERSION_CODE}'" || (echo "Invalid versionCode in APK" && exit 1)
          echo "$BADGING" | grep -q "versionName='${APP_VERSION_NAME}'" || (echo "Invalid versionName in APK" && exit 1)
          if echo "$BADGING" | grep -q "application-debuggable"; then
            echo "Release APK must not be debuggable"
            exit 1
          fi
          MIN_SDK="$(echo "$BADGING" | sed -n "s/.*sdkVersion:'\([0-9]*\)'.*/\1/p" | head -n1)"
          test -n "$MIN_SDK" && test "$MIN_SDK" -le 24 || (echo "minSdk must remain 24 or lower (found: $MIN_SDK)" && exit 1)

          VERIFY_OUT="$("$APKSIGNER" verify --print-certs "dist/$APK_NAME")"
          CERT_SHA256="$(echo "$VERIFY_OUT" | sed -n 's/.*SHA-256 digest: \([0-9a-fA-F]*\).*/\1/p' | head -n1 | tr '[:upper:]' '[:lower:]')"
          test "${#CERT_SHA256}" -eq 64 || (echo "Failed to extract signing certificate SHA-256" && exit 1)

          APK_SHA256="$(sha256sum "dist/$APK_NAME" | awk '{print tolower($1)}')"
          test "${#APK_SHA256}" -eq 64 || (echo "Failed to compute APK SHA-256" && exit 1)
          APK_SIZE="$(wc -c < "dist/$APK_NAME" | tr -d ' ')"

          cat > dist/release-manifest.json <<EOF
          {
            "packageName": "com.sjos.folionote",
            "versionName": "${APP_VERSION_NAME}",
            "versionCode": ${APP_VERSION_CODE},
            "minSdk": ${MIN_SDK},
            "apkFileName": "${APK_NAME}",
            "sizeBytes": ${APK_SIZE},
            "sha256": "${APK_SHA256}",
            "signingCertSha256": "${CERT_SHA256}",
            "tag": "${GITHUB_REF_NAME}",
            "releaseUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          }
          EOF
          cat dist/release-manifest.json

      - name: Publish APK and manifest on GitHub Releases
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: FolioNote ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/FolioNote-${{ github.ref_name }}.apk
            dist/release-manifest.json

  android-api24-smoke:
    name: API 24 Emulator Smoke Test
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    needs: android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle from the committed Wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare debug signing key
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storetype JKS \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Run instrumented tests on API 24 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          arch: x86_64
          target: default
          profile: Nexus 5X
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest
