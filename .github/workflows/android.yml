name: Android CI and Releases

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_release_preview:
        description: Build and smoke-test a signed release APK without publishing
        type: boolean
        required: false
        default: false
      release_version:
        description: Semantic version for the preview (for example 1.0.0)
        type: string
        required: false
        default: "1.0.0"

permissions:
  contents: write

concurrency:
  group: folionote-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build and test FolioNote
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle from the committed Wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare debug signing key
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storetype JKS \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Prepare CI-only release signing key
        if: ${{ github.ref_type != 'tag' && !(github.event_name == 'workflow_dispatch' && inputs.build_release_preview) }}
        shell: bash
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$GITHUB_WORKSPACE/ci-release.keystore" \
            -storetype JKS \
            -storepass ci-only-password \
            -keypass ci-only-password \
            -alias ci-release \
            -keyalg RSA -keysize 2048 -validity 365 \
            -dname "CN=FolioNote CI Only,O=FolioNote,C=US"
          chmod 600 "$GITHUB_WORKSPACE/ci-release.keystore"

      - name: Determine Android version
        shell: bash
        env:
          BUILD_RELEASE_PREVIEW: ${{ inputs.build_release_preview }}
          PREVIEW_VERSION: ${{ inputs.release_version }}
        run: |
          RELEASE_TAG=""
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
            VERSION="${RELEASE_TAG#v}"
          elif [[ "$BUILD_RELEASE_PREVIEW" == "true" ]]; then
            VERSION="$PREVIEW_VERSION"
            RELEASE_TAG="v${VERSION}"
          else
            VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"
            VERSION_CODE=$((100000000 + GITHUB_RUN_NUMBER))
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" || "$BUILD_RELEASE_PREVIEW" == "true" ]]; then
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Use semantic version format MAJOR.MINOR.PATCH."
              exit 1
            fi
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            if (( MINOR > 999 || PATCH > 999 )); then
              echo "Minor and patch components must be between 0 and 999."
              exit 1
            fi
            VERSION_CODE=$((200000000 + MAJOR * 1000000 + MINOR * 1000 + PATCH))
            if (( VERSION_CODE > 2100000000 )); then
              echo "Version code exceeds Android maximum (2100000000)."
              exit 1
            fi
          fi
          echo "APP_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Run unit tests (API 24..36 matrix) and build debug APK
        run: |
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest \
            -PappVersionName="$APP_VERSION_NAME" \
            -PappVersionCode="$APP_VERSION_CODE"

      - name: Run release lint and build with ephemeral CI signing key
        if: ${{ github.ref_type != 'tag' && !(github.event_name == 'workflow_dispatch' && inputs.build_release_preview) }}
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/ci-release.keystore
          STORE_PASSWORD: ci-only-password
          KEY_PASSWORD: ci-only-password
          KEY_ALIAS: ci-release
        run: |
          ./gradlew --no-daemon lintRelease assembleRelease \
            -PappVersionName="$APP_VERSION_NAME" \
            -PappVersionCode="$APP_VERSION_CODE"

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: folionote-unit-test-reports-${{ github.run_id }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
            app/build/reports/lint-results-release.html
            app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt
          if-no-files-found: ignore

      - name: Upload debug APK
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: FolioNote-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Restore release signing key
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.build_release_preview) }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 repository secret" && exit 1)
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/my-upload-key.jks"
          chmod 600 "$GITHUB_WORKSPACE/my-upload-key.jks"

      - name: Build signed release APK
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.build_release_preview) }}
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$STORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD repository secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD repository secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS repository secret" && exit 1)
          ./gradlew --no-daemon lintRelease assembleRelease \
            -PappVersionName="$APP_VERSION_NAME" \
            -PappVersionCode="$APP_VERSION_CODE"

      - name: Verify release APK and generate release-manifest.json
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.build_release_preview) }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$SOURCE_APK" || (echo "Release APK not found at $SOURCE_APK" && exit 1)

          test -n "$RELEASE_TAG" || (echo "Release tag is missing" && exit 1)
          APK_NAME="FolioNote-${RELEASE_TAG}.apk"
          mkdir -p dist
          cp "$SOURCE_APK" "dist/$APK_NAME"

          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          BADGING="$("$AAPT2" dump badging "dist/$APK_NAME")"
          echo "$BADGING" | grep -q "package: name='com.sjos.folionote'" || (echo "Invalid package name in APK" && exit 1)
          echo "$BADGING" | grep -q "versionCode='${APP_VERSION_CODE}'" || (echo "Invalid versionCode in APK" && exit 1)
          echo "$BADGING" | grep -q "versionName='${APP_VERSION_NAME}'" || (echo "Invalid versionName in APK" && exit 1)
          if echo "$BADGING" | grep -q "application-debuggable"; then
            echo "Release APK must not be debuggable"
            exit 1
          fi
          MIN_SDK="$(echo "$BADGING" | sed -n "s/.*sdkVersion:'\([0-9]*\)'.*/\1/p" | head -n1)"
          test -n "$MIN_SDK" && test "$MIN_SDK" -le 24 || (echo "minSdk must remain 24 or lower (found: $MIN_SDK)" && exit 1)

          VERIFY_OUT="$("$APKSIGNER" verify --print-certs "dist/$APK_NAME")"
          CERT_SHA256="$(echo "$VERIFY_OUT" | sed -n 's/.*SHA-256 digest: \([0-9a-fA-F]*\).*/\1/p' | head -n1 | tr '[:upper:]' '[:lower:]')"
          test "${#CERT_SHA256}" -eq 64 || (echo "Failed to extract signing certificate SHA-256" && exit 1)

          APK_SHA256="$(sha256sum "dist/$APK_NAME" | awk '{print tolower($1)}')"
          test "${#APK_SHA256}" -eq 64 || (echo "Failed to compute APK SHA-256" && exit 1)
          APK_SIZE="$(wc -c < "dist/$APK_NAME" | tr -d ' ')"

          cat > dist/release-manifest.json <<EOF
          {
            "packageName": "com.sjos.folionote",
            "versionName": "${APP_VERSION_NAME}",
            "versionCode": ${APP_VERSION_CODE},
            "minSdk": ${MIN_SDK},
            "apkFileName": "${APK_NAME}",
            "sizeBytes": ${APK_SIZE},
            "sha256": "${APK_SHA256}",
            "signingCertSha256": "${CERT_SHA256}",
            "tag": "${RELEASE_TAG}",
            "releaseUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          }
          EOF
          cat dist/release-manifest.json

      - name: Accept Android SDK licenses and install API 24 image for release smoke
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.build_release_preview) }}
        shell: bash
        run: |
          set +e
          yes | sdkmanager --licenses >/dev/null
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -e
          test "$LICENSE_STATUS" -eq 0
          set +e
          yes | sdkmanager "platform-tools" "emulator" "system-images;android-24;default;x86_64"
          INSTALL_STATUS=${PIPESTATUS[1]}
          set -e
          test "$INSTALL_STATUS" -eq 0

      - name: Smoke test signed release APK on API 24 emulator
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.build_release_preview) }}
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          arch: x86_64
          target: default
          profile: Nexus 5X
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r "dist/FolioNote-${RELEASE_TAG}.apk"
            adb shell svc wifi disable || true
            adb shell svc data disable || true
            adb shell am start -n com.sjos.folionote/.MainActivity
            APP_RUNNING=false
            for attempt in {1..15}; do
              if adb shell pidof com.sjos.folionote >/dev/null; then
                APP_RUNNING=true
                break
              fi
              sleep 1
            done
            if [[ "$APP_RUNNING" != "true" ]]; then
              adb logcat -d -t 1000 | tail -200
              exit 1
            fi
            if adb logcat -d -t 1000 | grep -E "FATAL EXCEPTION|Process: com.sjos.folionote"; then
              exit 1
            fi

      - name: Upload signed release preview artifact
        if: github.event_name == 'workflow_dispatch' && inputs.build_release_preview
        uses: actions/upload-artifact@v4
        with:
          name: FolioNote-release-preview-${{ inputs.release_version }}
          path: |
            dist/FolioNote-v${{ inputs.release_version }}.apk
            dist/release-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK and manifest on GitHub Releases
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: FolioNote ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/FolioNote-${{ github.ref_name }}.apk
            dist/release-manifest.json

  android-instrumented:
    name: Android API ${{ matrix.api-level }} Instrumented Tests
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: android
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 35]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false
          packages: ''

      - name: Accept Android SDK licenses and install API 24 emulator image
        shell: bash
        run: |
          set +e
          yes | sdkmanager --licenses >/dev/null
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -e
          test "$LICENSE_STATUS" -eq 0

          set +e
          yes | sdkmanager "platform-tools" "emulator" "system-images;android-${{ matrix.api-level }};default;x86_64"
          INSTALL_STATUS=${PIPESTATUS[1]}
          set -e
          test "$INSTALL_STATUS" -eq 0
          adb version

      - name: Set up Gradle from the committed Wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare debug signing key
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storetype JKS \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Run instrumented tests on Android API ${{ matrix.api-level }} emulator
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 20
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          profile: Nexus 5X
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            ./gradlew --no-daemon assembleDebugAndroidTest
            ./gradlew --offline --no-daemon connectedDebugAndroidTest

      - name: Capture emulator and instrumented-test diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          adb devices -l > artifacts/adb-devices.txt 2>&1 || true
          adb logcat -d > artifacts/emulator-logcat.txt 2>&1 || true
          find app/build/reports app/build/outputs -maxdepth 5 \
            \( -iname '*androidTest*' -o -iname '*connected*' \) -print \
            > artifacts/instrumented-report-paths.txt 2>&1 || true

      - name: Upload instrumented test reports and emulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: folionote-instrumented-api-${{ matrix.api-level }}-${{ github.run_id }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/test-results/connected/
            artifacts/
          if-no-files-found: ignore
