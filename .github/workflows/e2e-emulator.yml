name: E2E user flow (emulator)

# Roteiro de usuário real no emulador API 29 (Android 10) x86_64 com KVM (imagem default, oficial). Gera prints de cada tela e um relatório por etapa.
# Os prints são publicados na branch temporária e2e/inspect para inspeção (apagada depois).

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "scripts/e2e/**"
      - ".github/workflows/e2e-emulator.yml"

permissions:
  contents: write

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: User flow on API 29 emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK, emulator and API 29 system image
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "emulator" \
            "system-images;android-29;default;x86_64"

      - name: Prepare debug signing key
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storetype JKS -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Gradle from the committed Wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK for the x86_64 emulator
        run: |
          set -o pipefail
          mkdir -p e2e-artifacts
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug -Pe2eEmulator=true 2>&1 | tee e2e-artifacts/build.log

      - name: Cache AVD
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/avd/*.ini
          key: avd-api29-default-x86_64-v1

      - name: Run user flow on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 5X
          disable-animations: true
          disable-spellchecker: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -camera-back none -memory 2048
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            python3 scripts/e2e/run_user_flow.py --out e2e-artifacts

      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ github.run_id }}
          path: e2e-artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Publish screenshots to the inspection branch
        if: always()
        run: |
          set -e
          git config user.name "e2e-bot"
          git config user.email "e2e-bot@users.noreply.github.com"
          git checkout -B e2e/inspect
          rm -rf e2e-inspect
          mkdir -p e2e-inspect
          cp -r e2e-artifacts/. e2e-inspect/ 2>/dev/null || true
          git add -f e2e-inspect
          git commit -q -m "e2e: screenshots of run ${GITHUB_RUN_ID}" || { echo "nothing new"; exit 0; }
          git push -q -f origin e2e/inspect
          echo "published e2e-inspect/ on branch e2e/inspect"
